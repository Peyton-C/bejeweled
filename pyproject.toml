[project]
name = "bejeweled"
version = "0.2.0"
description = "Split songs into stems, and author NI stem files from them"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"  # tomllib
dependencies = [
    "requests>=2.31",
    "pycryptodome>=3.20",
]

[project.scripts]
bejeweled = "bejeweled.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bejeweled"]

[dependency-groups]
dev = ["pytest>=8.0"]
